{% load storydesk_tags %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StoryDesk{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #243047;
            background: #f5f7fb;
        }
        header, footer {
            background: #243047;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
        }
        nav a, header a {
            color: white;
        }
        main {
            background: white;
            margin: 20px 0;
            padding: 24px;
            border-radius: 8px;
        }
        a { color: #2459a9; }
        input, select, textarea, button {
            padding: 8px;
            margin: 5px 0;
            max-width: 100%;
        }
        button { cursor: pointer; }
        footer { font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'story_list' %}">StoryDesk</a>
        <a href="{% url 'topic_list' %}">Теми</a></h1>
        <p>Твоят редакционен бележник</p>
        <nav>
            <a href="{% url 'story_list' %}">Материали</a>
            <a href="{% url 'source_list' %}">Източници</a>
            <a href="{% url 'note_list' %}">Бележки</a>
            <a href="{% url 'task_list' %}">Задачи</a>
        </nav>
    </header>

    <main>
        {% include 'partials/messages.html' %}
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>StoryDesk — редакционна организация и проучвания · {% current_year %}</p>
    </footer>
</body>
</html>
