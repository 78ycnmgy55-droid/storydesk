```html
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нова тема — StoryDesk</title>
</head>
<body>
    <header>
        <h1>StoryDesk</h1>
        <p>Организирай материалите си по теми</p>
    </header>

    <main>
        <h2>Добавяне на тема</h2>

        {% if success %}
            <p style="color: green;">{{ success }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Запази темата</button>
        </form>

        <p>
            <a href="{% url 'topic_create' %}">Добави друга тема</a>
        </p>
        <p>
            <a href="{% url 'story_list' %}">Обратно към материалите</a>
        </p>
    </main>
</body>
</html>
