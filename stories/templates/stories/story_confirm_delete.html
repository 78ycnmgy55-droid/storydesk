{% extends "base.html" %}

{% block title %}Изтриване на материал | StoryDesk{% endblock %}

{% block content %}
<h2>Изтриване на материал</h2>

<p>
    Сигурен ли си, че искаш да изтриеш
    „{{ story.title }}“?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, изтрий</button>
</form>

<p>
    <a href="{% url 'story_detail' story.pk %}">Отказ</a>
</p>
{% endblock %}
